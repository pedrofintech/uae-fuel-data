name: Update UAE fuel prices

on:
  schedule:
    # Diario as 05:10 UTC (09:10 no Golfo) - apanha o anuncio de fim de mes
    # e a entrada em vigor no dia 1. Corre todos os dias porque tambem
    # atualiza a previsao (Brent) do next month.
    - cron: '10 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update fuel data
        run: python scripts/update.py

      - name: Commit and push if changed
        run: |
          git config user.name "fuel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add petrol.json
          git diff --cached --quiet || (git commit -m "Update fuel data $(date -u +%F)" && git push)
